# Server Port
server.port=8080

# MS SQL Server Configuration
# Using IntegratedSecurity=true for Windows Authentication since no credentials were provided
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=BloodBankDB;integratedSecurity=true;encrypt=true;trustServerCertificate=true;
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Thymeleaf cache
spring.thymeleaf.cache=false
